services:
  - type: web
    name: marketvision-ai-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements-render.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false   # deploys are a human decision
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MARKETVISION_ENV
        value: production
      - key: MARKETVISION_ENABLE_FINBERT
        value: "0"
      # The free plan has NO persistent disk: the prediction ledger and the paper-trading
      # database are lost on every restart. Attach a paid disk (mount backend/data) or treat
      # this deployment as a stateless research API.
      - key: MARKETVISION_CORS_ORIGINS
        sync: false
      - key: MARKETVISION_TOOL_TOKEN
        sync: false
      - key: MARKETVISION_ADMIN_TOKEN
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      # NewsAPI's free Developer plan forbids production use, so the app ignores NEWSAPI_KEY
      # here unless MARKETVISION_NEWSAPI_PAID_PLAN=1 (set that only for a paid plan).
      - key: NEWSAPI_KEY
        sync: false
      - key: MARKETVISION_NEWSAPI_PAID_PLAN
        sync: false
      - key: MARKETVISION_LLM_API_KEY
        sync: false
      - key: MARKETVISION_LLM_BASE_URL
        sync: false
      - key: MARKETVISION_LLM_MODEL
        sync: false
